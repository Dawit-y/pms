[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=68", "wheel" ]

[project]
name = "pms-api"
version = "0.1.0"
description = "Project Management System"
readme = "README.md"
license = { text = "Not open source" }
authors = [
  { name = "Dawit Yimer", email = "dawityimer52@gmail.com" },
]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "argon2-cffi==25.1.0",
  "celery[redis]>=5.5.0",
  "django==6.0.6",
  "django-anymail[mailgun]==14.0",
  "django-celery-beat>=2.7.0",
  "django-celery-results>=2.5.1",
  "django-cors-headers==4.9.0",
  "django-environ==0.14.0",
  "django-filter>=25.2",
  "django-ipware>=7.0.1",
  "django-model-utils==5.0.0",
  "django-mptt>=0.18.0",
  "django-redis==6.0.0",
  "djangorestframework==3.17.1",
  "djangorestframework-simplejwt>=5.5.1",
  "drf-spectacular==0.29.0",
  "faker>=40.28.1",
  "gunicorn==25.3.0",
  "hiredis==3.4.0",
  "openpyxl>=3.1.5",
  "pillow==12.3.0",
  "psycopg[c]==3.3.4",
  "pytest-cov>=7.1.0",
  "python-decouple>=3.8",
  "python-slugify==8.0.4",
  "redis>=5.0,<6.5",
  "reportlab>=4.2.5",
  "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
  "coverage==7.15.0",
  "django-coverage-plugin==3.2.2",
  "django-debug-toolbar==6.3.0",
  "django-extensions==4.1",
  "django-stubs[compatible-mypy]==6.0.6",
  "djangorestframework-stubs==3.17.0",
  "djlint==1.40.3",
  "factory-boy==3.3.3",
  "flower>=2.0.1",
  "ipdb==0.13.13",
  "mypy==1.20.0",
  "pre-commit==4.6.0",
  "psycopg[c]==3.3.4",
  "pytest==9.1.1",
  "pytest-django==4.12.0",
  "pytest-sugar==1.1.1",
  "ruff==0.15.20",
  "sphinx==9.1.0",
  "sphinx-autobuild==2025.8.25",
  "werkzeug[watchdog]==3.1.8",
]

[tool.setuptools]
packages.find.where = [ "." ]
packages.find.include = [ "pms_api*", "config*" ]
packages.find.exclude = [ "tests*", "compose*", "docs*" ]

[tool.ruff]
line-length = 100
# Exclude a variety of commonly ignored directories.
extend-exclude = [
  "*/migrations/*.py",
  "staticfiles/*",
]
lint.select = [
  "A",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "S101",   # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "SIM102", # sometimes it's better to nest
  # of types for comparison.
  # Deactivated because it can make the code slow:
  # https://github.com/astral-sh/ruff/issues/7871
]
lint.per-file-ignores."**/conftest.py" = [
  "S106", # Possible hardcoded password (test fixtures)
]
# Per-file ignores for test files
lint.per-file-ignores."**/tests/**/*.py" = [
  "F841",    # Local variable assigned but never used (test setup)
  "PLR2004", # Magic value in comparison (test assertions)
  "S106",    # Possible hardcoded password (test fixtures)
]
lint.isort.force-single-line = true

[tool.pyproject-fmt]
keep_full_version = true

# ==== mypy ====
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = [
  "mypy_django_plugin.main",
  "mypy_drf_plugin.main",
]
overrides = [
  # Django migrations should not produce any errors:
  { module = "*.migrations.*", ignore_errors = true },
]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest]
# ==== pytest ====
ini_options.minversion = "6.0"
ini_options.addopts = "--ds=config.settings.test --reuse-db --import-mode=importlib"
ini_options.python_files = [
  "tests.py",
  "test_*.py",
]

[tool.coverage]
# ==== Coverage ====
run.include = [ "pms_api/**" ]
run.omit = [ "*/migrations/*", "*/tests/*" ]
run.plugins = [ "django_coverage_plugin" ]

# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
# TODO: remove T002 when fixed https://github.com/djlint/djLint/issues/687
ignore = "H006,H030,H031,T002"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"
css.indent_size = 2
js.indent_size = 2
