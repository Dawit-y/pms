volumes:
  pms_api_local_postgres_data: {}
  pms_api_local_postgres_data_backups: {}
  pms_api_local_redis_data: {}


services:
  django:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: pms_api_local_django
    container_name: pms_api_local_django
    depends_on:
      - postgres
      - redis
    volumes:
      - /app/.venv
      - .:/app:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    ports:
      - '8000:8000'
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: pms_api_production_postgres
    container_name: pms_api_local_postgres
    volumes:
      - pms_api_local_postgres_data:/var/lib/postgresql/18/docker
      - pms_api_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres

  redis:
    image: docker.io/redis:7.2
    container_name: pms_api_local_redis
    volumes:
      - pms_api_local_redis_data:/data

  celeryworker:
    <<: &django-anchor
      build:
        context: .
        dockerfile: ./compose/local/django/Dockerfile
      image: pms_api_local_django
      depends_on:
        - postgres
        - redis
      volumes:
        - /app/.venv
        - .:/app:z
      env_file:
        - ./.envs/.local/.django
        - ./.envs/.local/.postgres
    container_name: pms_api_local_celeryworker
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django-anchor
    container_name: pms_api_local_celerybeat
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django-anchor
    container_name: pms_api_local_flower
    ports:
      - '5555:5555'
    command: /start-flower
