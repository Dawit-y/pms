volumes:
  production_postgres_data: {}
  production_postgres_data_backups: {}
  production_redis_data: {}



services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile

    image: pms_api_production_django
    volumes:
      - /srv/pms_api/static:/app/staticfiles
      - /srv/pms_api/media:/app/pms_api/media
    depends_on:
      - postgres
      - redis
    env_file:
      - ./.envs/.production/.django
      - ./.envs/.production/.postgres
    ports:
      - '127.0.0.1:5000:5000'
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: pms_api_production_postgres
    volumes:
      - production_postgres_data:/var/lib/postgresql/18/docker
      - production_postgres_data_backups:/backups
    env_file:
      - ./.envs/.production/.postgres

  redis:
    image: docker.io/redis:8.6
    volumes:
      - production_redis_data:/data

  celeryworker:
    <<: *django
    image: pms_api_production_celeryworker
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: pms_api_production_celerybeat
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: pms_api_production_flower
    ports:
      - '5555:5555'
    command: /start-flower
